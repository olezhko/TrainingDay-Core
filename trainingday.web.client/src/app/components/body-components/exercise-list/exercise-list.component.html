<div class="exercise-list-page">
  <div class="exercise-list-header">
    <div class="exercise-list-header-inner">
      <div>
        <h1 class="page-title">Exercises</h1>
        <p class="page-subtitle">Browse our complete exercise library with technique guides and muscle targets</p>
      </div>
    </div>
  </div>

  <div class="exercise-list-body">
    <div class="exercise-grid">
      <app-exercise-preview *ngFor="let exercise of exercisePreviews" [exercise]="exercise"></app-exercise-preview>
    </div>

    <div *ngIf="exercisePreviews?.length === 0" class="exercise-empty">
      <p>No exercises found.</p>
    </div>
  </div>
</div>
