<div class="exercise-list-page">
  <div class="exercise-list-header">
    <div class="exercise-list-header-inner">
      <div>
        <h1 class="page-title">Exercises</h1>
        <p class="page-subtitle">Browse our complete exercise library with technique guides and muscle targets</p>
      </div>
      <button *ngIf="authService.isAdmin" class="admin-btn" (click)="createNew()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        New Exercise
      </button>
    </div>
  </div>

  <div class="filter-panel">
    <div class="filter-panel-inner">
      <div class="search-row">
        <div class="search-input-wrap">
          <mat-icon class="search-icon">search</mat-icon>
          <input
            class="search-input"
            type="text"
            placeholder="Search exercises..."
            [value]="filterName"
            (input)="onSearchInput($any($event.target).value)" />
        </div>

        <button class="filter-toggle-btn" (click)="filtersExpanded = !filtersExpanded">
          <mat-icon>{{ filtersExpanded ? 'expand_less' : 'tune' }}</mat-icon>
          Filters
          <span *ngIf="activeFilterCount > 0" class="filter-badge">{{ activeFilterCount }}</span>
        </button>

        <button *ngIf="activeFilterCount > 0" class="clear-btn" (click)="clearFilters()">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div *ngIf="filtersExpanded" class="filter-sections">
        <div class="filter-section">
          <span class="filter-label">Muscles</span>
          <div class="muscle-groups">
            <div *ngFor="let group of muscleGroups" class="muscle-group">
              <span class="muscle-group-label">{{ group.label }}</span>
              <div class="chip-list">
                <button
                  *ngFor="let opt of group.options"
                  class="chip"
                  [class.chip-active]="opt.selected"
                  (click)="toggleMuscle(opt)">
                  {{ opt.label }}
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="filter-section">
          <span class="filter-label">Tags</span>
          <div class="chip-list">
            <button
              *ngFor="let opt of tagOptions"
              class="chip"
              [class.chip-active]="opt.selected"
              (click)="toggleTag(opt)">
              {{ opt.label }}
            </button>
          </div>
        </div>

        <div class="filter-section">
          <span class="filter-label">Difficulty</span>
          <div class="chip-list">
            <button
              *ngFor="let opt of difficultyOptions"
              class="chip"
              [class.chip-active]="opt.selected"
              [ngClass]="'chip-diff-' + opt.label.toLowerCase()"
              (click)="toggleDifficulty(opt)">
              {{ opt.label }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="exercise-list-body">
    <div *ngIf="loading" class="exercise-empty">
      <p>Loading...</p>
    </div>

    <div *ngIf="!loading" class="exercise-grid">
      <app-exercise-preview *ngFor="let exercise of exercisePreviews" [exercise]="exercise"></app-exercise-preview>
    </div>

    <div *ngIf="!loading && exercisePreviews?.length === 0" class="exercise-empty">
      <p>No exercises found.</p>
    </div>
  </div>
</div>
