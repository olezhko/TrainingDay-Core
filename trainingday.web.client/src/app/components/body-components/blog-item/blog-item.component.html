<div class="blog-item-page" *ngIf="blogPost() as post">
  <div class="blog-item-header">
    <div class="blog-item-header-inner">
      <div class="blog-item-meta">
        <span class="blog-author">{{ post.author }}</span>
        <span class="blog-dot"></span>
        <span class="blog-date">{{ post.date | date:'MMMM d, y' }}</span>
      </div>
      <h1 class="blog-item-title">{{ post.title }}</h1>
    </div>
  </div>

  <div class="blog-item-body">
    <div class="blog-item-content html-wrapper-description" [innerHTML]="post.view"></div>
    <div *ngIf="authService.isAdmin" class="admin-actions">
      <button class="admin-btn" (click)="edit()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        Edit
      </button>
      <button class="admin-btn admin-btn-danger" (click)="delete()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
        Delete
      </button>
    </div>
    <a href="/blogs" class="blog-back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Back to Blog
    </a>
  </div>
</div>

<div class="blog-item-loading" *ngIf="!blogPost()">
  <div class="blog-loading-spinner"></div>
  <p>Loading article...</p>
</div>
