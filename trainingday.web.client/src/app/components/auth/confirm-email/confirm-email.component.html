<div class="auth-page">
  <div class="auth-header">
    <div class="auth-header-inner">
      <h1 class="page-title">Email Confirmation</h1>
      <p class="page-subtitle">Verifying your TrainingDay account</p>
    </div>
  </div>

  <div class="auth-body">
    <div class="auth-card">

      <div class="state-loading" *ngIf="state() === 'loading'">
        <div class="spinner"></div>
        <p>Confirming your email address...</p>
      </div>

      <div class="state-success" *ngIf="state() === 'success'">
        <div class="state-icon success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </div>
        <h2>Email Confirmed!</h2>
        <p>Your account is now active. You can sign in to TrainingDay.</p>
        <a routerLink="/login" class="btn-primary">Sign In</a>
      </div>

      <div class="state-error" *ngIf="state() === 'error'">
        <div class="state-icon error-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
        </div>
        <h2>Confirmation Failed</h2>
        <p>{{ errorMessage() }}</p>
        <a routerLink="/register" class="btn-secondary">Register again</a>
      </div>

    </div>
  </div>
</div>
